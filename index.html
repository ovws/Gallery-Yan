<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12060c" />
  <title>嫣</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>嫣</text></svg>" />
</head>
<body>
  <header class="top">
    <a class="logo" href="./">嫣</a>
    <div class="modes" role="group" aria-label="视图">
      <button type="button" id="btn-large" class="mode on" aria-pressed="true">大图</button>
      <button type="button" id="btn-small" class="mode" aria-pressed="false">小图</button>
    </div>
  </header>

  <main>
    <div id="wall" class="wall wall-large"></div>
    <p id="status" class="status">加载中…</p>
  </main>

  <div id="lb" class="lb" hidden>
    <button type="button" class="lb-x" id="lb-x" aria-label="关闭"></button>
    <button type="button" class="lb-p" id="lb-p" aria-label="上一张"></button>
    <button type="button" class="lb-n" id="lb-n" aria-label="下一张"></button>
    <img id="lb-img" alt="" />
    <p id="lb-cap" class="lb-cap"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
