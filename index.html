<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="嫣" />
  <meta name="theme-color" content="#14080e" />
  <title>嫣</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="images.json" as="fetch" crossorigin />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' x='50%' text-anchor='middle' font-size='72' fill='%23ff7aa2' font-family='serif'>嫣</text></svg>" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="floaters" id="floaters"></div>
  </div>

  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="嫣"><span>嫣</span></a>
    <div class="view-toggle" role="group" aria-label="大图小图切换">
      <button type="button" class="view-btn active" data-view="large" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
        大图
      </button>
      <button type="button" class="view-btn" data-view="small" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
        小图
      </button>
    </div>
  </header>

  <main>
    <div id="gallery" class="gallery view-large"></div>
    <div id="loader" class="loader" aria-live="polite">
      <div class="loader-dot"></div>
    </div>
  </main>

  <footer class="site-end" aria-hidden="true">
    <span class="end-line"></span>
    <span class="end-mark">嫣</span>
    <span class="end-line"></span>
  </footer>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="预览">
    <div class="lb-backdrop"></div>
    <button type="button" class="lb-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="lb-nav lb-prev" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" class="lb-nav lb-next" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lb-stage">
      <img id="lb-img" alt="" />
      <p id="lb-name" class="lb-name"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
